<!--
================================================================================
  TRAININGSLOG – ENTWICKLER- UND ANPASSUNGS-DOKUMENTATION
  (Diese Doku ist bewusst IN der App eingebettet, damit sie nie verlorengeht und
   nie von der App wegdriftet. Sie ist ein HTML-Kommentar und erscheint NICHT
   auf dem Bildschirm. Wer diese Datei öffnet – Mensch oder KI – findet hier
   alles, um die App sicher zu verstehen und zu ändern, ohne das ursprüngliche
   Entstehungsgespräch zu kennen.)
================================================================================

--------------------------------------------------------------------------------
0. WIE DU (KI ODER MENSCH) DIESE DATEI ÄNDERST – ZUERST LESEN
--------------------------------------------------------------------------------
- Die GESAMTE App ist EINE einzige Datei: index.html. HTML, CSS und JavaScript
  liegen zusammen in dieser Datei. Es gibt KEINE externen Dateien, KEINE
  Bibliotheken, KEIN Framework, KEINEN Build-Schritt. Das ist ABSICHT (siehe
  Abschnitt 6). Halte das bei jeder Änderung ein: nichts auslagern, nichts
  extern nachladen. Alles bleibt inline in dieser Datei.
- Diese Doku bei JEDER Änderung mitpflegen. Wenn du Code änderst, aktualisiere
  den betroffenen Doku-Abschnitt im selben Zug. Sonst driftet die Doku weg –
  genau das soll die Einbettung verhindern.
- Nach dem Ändern IMMER die JavaScript-Syntax prüfen, bevor ausgeliefert wird.
  Die App hat keinen Build, ein Syntaxfehler macht sie stumm unbenutzbar.

DEPLOY / WIE EINE ÄNDERUNG AUFS IPHONE KOMMT:
- Die App wird über GitHub Pages gehostet (öffentliches Repo des Nutzers,
  Datei liegt dort als index.html). Live-Adresse ist eine GitHub-Pages-URL der
  Form https://<user>.github.io/<repo>/ .
- Eine geänderte Version wird als index.html bei GitHub hochgeladen und
  überschreibt die alte. Adresse UND gespeicherte Nutzerdaten bleiben dabei
  erhalten (Daten hängen an der URL, nicht an der Datei).
- Der Nutzer betreibt die App als "Zum Home-Bildschirm hinzugefügte" App
  (PWA/Home-Screen-App) in Safari auf iOS. NUR so funktioniert der Wake Lock
  (Bildschirm bleibt beim Training an). Als lose lokale Datei oder in manchen
  Dritt-Browsern funktioniert Wake Lock NICHT. Beim Ändern nichts tun, was die
  PWA-Installierbarkeit bricht (Manifest, apple-touch-icon, Meta-Tags im <head>).

NICHT VERSEHENTLICH BRECHEN (Regressionsgefahr):
- localStorage-Speicherung (Abschnitt 3) – sonst Datenverlust beim Nutzer.
- Wake Lock (Abschnitt 3) – sonst geht der Bildschirm beim Training aus.
- PWA-Einbettung im <head> (Manifest + Icon + Meta-Tags als Data-URIs).
- Timer/Ton-Logik (Abschnitt 3) – Kernfunktion während des Trainings.
- CSV-Export-Struktur (Abschnitt 3) – der Nutzer wertet die CSV langfristig aus.

--------------------------------------------------------------------------------
1. ZWECK & KONTEXT
--------------------------------------------------------------------------------
Persönlicher Trainingslog für EINEN Nutzer (Krafttraining, Muskelaufbau).
Der Nutzer trainiert typ. 3x/Woche (Di/Do/Sa) und nutzt die App über Jahre.
Zweck: Sätze/Gewichte/Wiederholungen pro Übung erfassen, Doppelprogression
unterstützen, Pausen-Timer mit Ton, Verlauf speichern, CSV zur Auswertung.

RAHMENBEDINGUNGEN DES NUTZERS (können sich ändern – dann Plan anpassen):
- Zwei Wohnungen, nie beide gleichzeitig. Wohnung A: verstellbare Schrägbank +
  Verstellhantel mit 1-kg-Schritten. Wohnung B: KEINE Bank, Hantel mit nur
  2,5-kg-Schritten. Daher der Orts-/Bank-Schalter (mit Bank / ohne Bank) und
  zwei Gewichtsschritte. Zusätzlich Widerstandsband mit Türanker (Latzug).
- Schichtarbeit (kann sich ändern) – deshalb keine feste Uhrzeit-Logik.
- "Rad-Frage": An manchen Beintagen hängt ab, ob der Nutzer am Vor-Sonntag Rad
  gefahren ist (Erholung der Beine). Steuert, welcher Tag der schwere Beintag ist.
Wenn sich diese Rahmenbedingungen ändern (kein Schichtdienst mehr, andere
Geräte, andere Wohnsituation): Orts-/Rad-Logik und Tagesdefinitionen anpassen.

--------------------------------------------------------------------------------
2. TRAININGSPRINZIPIEN (fachlich – siehe Abschnitt 4 zur Aktualisierung!)
--------------------------------------------------------------------------------
- Doppelprogression: erst Wiederholungen im Zielfenster hocharbeiten, dann
  Gewicht steigern. Steigerung erst nach mehreren Bestätigungen (Standard 2)
  im oberen Wdh-Bereich.
- Intensität ~RIR 1-3 (Reps in Reserve), Training nahe technischem Versagen.
- Wdh-Fenster je Übungstyp (grob): schwere Grund-/Beinübungen 8-12,
  Schulterdrücken 6-12, Latzug 10-15, Bizeps/Trizeps 10-20,
  Seitheben/Waden 12-25.
- Progression SATZWEISE möglich (nicht nur ganze Übung) – wichtig wegen der
  groben 2,5-kg-Hantel in Wohnung B (siehe Abschnitt 4B).
- Übungsauswahl-Leitprinzip: Übungen, die den Muskel in gedehnter Position stark
  belasten, werden bevorzugt (Stand der Forschung 2024/25). Daraus entstehen die
  objektiv sortierten Ranglisten je Muskel-Slot.

--------------------------------------------------------------------------------
3. CODE-STRUKTUR (wo liegt was)
--------------------------------------------------------------------------------
Alles in dieser index.html. Grobe Landkarte (Zeilennummern verschieben sich bei
Änderungen – nach den genannten Namen/Stichworten suchen):

- <head>: Meta-Tags, PWA-Manifest + apple-touch-icon (als Data-URIs inline),
  danach <style> mit allen CSS-Variablen (:root) und Regeln.
- const SLOTS = { ... }  → ZENTRALE Übungsdatenbank. Pro Slot (z.B. Brust,
  Rücken, Beine-quad, Beine-hinge, Schulter, Bizeps, Trizeps, Waden) eine Liste
  von Übungen in OBJEKTIVER Rangfolge (beste zuerst = Standard). Pro Übung:
  Name, Wdh-Bereich (lo/hi), Flags wie bankOnly (nur mit Bank nutzbar),
  ggf. Marker/Hinweise. HIER ändert man Übungen/Geräte am einfachsten.
- function daySlots(dayKey) → welche Slots an welchem Tag (Di/Do/Sa) trainiert
  werden, inkl. der Rad-abhängigen Wahl des schweren Beintags.
- function step() → aktueller Gewichtsschritt (pref.stepBank / pref.stepNoBank
  je nach Orts-Schalter).
- Progressions-/Bestwert-Logik: bestUpdate(), applyWeight(), "suggest"-Felder →
  berechnen Steigerungsvorschläge und führen Bestwerte pro Satz-Position/Gewicht.
- Timer/Ton: startExPause() (stille Übungspause, Ton am Ende), Satz-Pause-Timer
  (sichtbarer roter Countdown), tickSoft()/tickLoud() (Pieptöne), tone()/prime()
  (WebAudio). Läuft nur zuverlässig bei aktivem Bildschirm → Wake Lock.
- Wake Lock: wakeOn()/wakeOff() + visibilitychange-Reaktivierung. Standard-API,
  browserunabhängig, überspringt still wo nicht verfügbar.
- Speicher: const K = {...} (localStorage-Schlüssel), save()/load(). Alle
  Nutzerdaten liegen im localStorage, gebunden an die URL. Schlüssel u.a.:
  hist (Verlauf), last (letzte Werte je Übung), best (Bestwerte),
  struct (Satz-/Pausen-Struktur), swap (aktive Übung je Slot),
  custom (eigene Übungen je Slot), pref (Einstellungen), radwk (Rad-Status).
- Export: buildCSV() (lesbare/auswertbare Tabelle, Semikolon-getrennt, BOM,
  eine Zeile pro Satz, mit Kontextspalten Ort/Rad/Status), buildBackupBlob()
  (vollständiges JSON-Backup zur Wiederherstellung), shareOrDownload()
  (iOS-Teilen-Menü mit Datei, Fallback Download), exportData()/exportCSV().
- restoreData(): spielt ein JSON-Backup zurück (ersetzt aktuellen Stand).

--------------------------------------------------------------------------------
4. ZWEI ARTEN VON ENTSCHEIDUNGEN – UNBEDINGT UNTERSCHEIDEN
--------------------------------------------------------------------------------
Beim Anpassen der App gibt es ZWEI grundverschiedene Kategorien. Sie dürfen
NICHT gleich behandelt werden.

4A. FACHLICH / EVIDENZBASIERT  → AKTIV NACH NEUESTER FORSCHUNG AKTUALISIEREN
    Dazu gehören: die Übungs-Ranglisten in SLOTS, die Wdh-Fenster, das
    Progressionsprinzip, das "gedehnte Position"-Leitprinzip, Satzpausen.
    Diese beruhen auf dem TRAININGSWISSENSCHAFTLICHEN STAND 2024/25.
    ANWEISUNG DES NUTZERS: Der Plan soll NICHT auf einem eingefrorenen Stand
    verharren. Wer hier etwas ändert oder den Plan überarbeitet, soll VORHER
    GEZIELT die aktuell neueste Studienlage und seriöse Fachliteratur prüfen
    (nicht nur "dürfen" – aktiv recherchieren) und den Plan nach dem dann
    besten verfügbaren Wissen erstellen. Diese Doku ist die Ausgangsbasis,
    nicht die Obergrenze. Wenn neuere/detailliertere Studien der Empfehlung
    hier widersprechen, hat die aktuelle Evidenz Vorrang.

4B. PERSÖNLICH / GESUNDHEITLICH  → GESCHÜTZT, NUR MIT DEM NUTZER ÄNDERN
    Diese Setzungen sind KEINE wissenschaftlichen Aussagen, sondern
    Anpassungen an den KÖRPER DES NUTZERS. Keine Studie hebt sie auf.
    NICHT "nach Studienlage wegoptimieren". Nur in Rücksprache mit dem Nutzer:
    - RDL (rumänisches Kreuzheben) ist fachlich in der hinge-Rangliste top,
      ist hier aber wegen des UNTEREN RÜCKENS des Nutzers NICHT der stille
      Standard bzw. mit Vorsicht markiert. Eine KI darf das NICHT als
      "Inkonsistenz" glattziehen und RDL zum Default machen.
    - Schulterdrücken/Arnold-Press sind nur mit dem Marker "beobachten"
      versehen (ärztlich abgeklärt, kein Befund; Drücken schmerzt nicht,
      andere Bewegung schon). Das ist eine individuelle Vorsicht, kein
      fachlicher Mangel der Übung. Nicht entfernen "weil die Übung gut ist".
    - Der bankOnly-Ausschluss (bestimmte Übungen sind ohne Bank ausgegraut)
      ist eine GERÄTE-Realität von Wohnung B, keine Wertung der Übung.

--------------------------------------------------------------------------------
5. ÄNDERUNGS-SPIELREGELN (zusammengefasst)
--------------------------------------------------------------------------------
1) Alles bleibt in DIESER einen index.html. Keine externen Dateien/Libs/Build.
2) Diese Doku bei jeder Änderung mitpflegen.
3) Fachliche Änderungen (4A): vorher aktuelle Forschung/Fachliteratur gezielt
   prüfen und einarbeiten.
4) Persönliche/gesundheitliche Setzungen (4B): geschützt, nur mit dem Nutzer.
5) Ranglisten bleiben OBJEKTIV sortiert (beste Übung zuerst = Standard),
   Ausnahme nur bei gesundheitlicher Einschränkung (dann als solche markiert,
   nicht die Sortierung verfälschen).
6) Nach der Änderung: JS-Syntax prüfen, als index.html bei GitHub hochladen.
   PWA/Wake Lock/localStorage/Timer/CSV-Struktur nicht brechen (Abschnitt 0).
7) Datenkompatibilität: bestehende localStorage-Schlüssel (K) nicht umbenennen
   ohne Migration – sonst verliert der Nutzer seinen Verlauf.

--------------------------------------------------------------------------------
6. WARUM DIE ARCHITEKTUR SO IST (bewusste Wahl, kein Zufall)
--------------------------------------------------------------------------------
- EINE Datei, kein Framework, keine Abhängigkeiten: damit die App über viele
  Jahre unabhängig lauffähig und von jeder KI/Person wart- und anpassbar bleibt,
  ohne Toolchain, ohne veraltende Pakete, ohne Netzwerkabhängigkeit.
- localStorage statt Server/Cloud: keine Konten, keine fremde Infrastruktur,
  volle Datenhoheit beim Nutzer, offlinefähig. Preis: Daten sind an die URL
  gebunden – deshalb die Backup-/CSV-Export-Funktionen.
- Selbst gehostet auf GitHub Pages als PWA: nötig, damit Wake Lock (Bildschirm
  an) auf iOS funktioniert; zugleich kostenlos, dauerhaft, versioniert.
- Diese eingebettete Doku: damit die BEGRÜNDUNGEN (das "warum") die App
  überleben und künftige Änderungen informiert statt blind erfolgen.

  ABSICHT DES NUTZERS in einem Satz: Die App soll sich selbst erklären, damit
  sie über Jahre wart- und anpassbar bleibt – unabhängig vom ursprünglichen
  Gespräch, von einer bestimmten KI und vom Gedächtnis des Nutzers – und damit
  niemand beim "Aufräumen" die gesundheitlichen Schutzentscheidungen zerstört,
  während der fachliche Teil ausdrücklich nach neuer Forschung wachsen darf.

<style>
  :root{--bg:#0f1115;--card:#1a1d24;--card2:#22262f;--line:#2c313c;--txt:#e8ebf0;--dim:#9aa3b2;--accent:#4a9eff;--good:#3ecf8e;--warn:#ffb454;--danger:#ff6b6b;--radius:14px;}

  .sets{margin-top:10px;}

  .restbtn{background:var(--card2);border:1px solid rgba(74,158,255,.28);}

  .restbtn.done{color:var(--good);font-weight:700;}
  .exfoot{display:flex;gap:8px;margin-top:8px;}
  .exfoot button{flex:1;font-size:14px;padding:9px;}
  .noteinput{width:100%;margin-top:8px;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px;font-size:14px;font-family:inherit;}
  .altsheet{margin-top:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px;}
  .altsheet button{display:block;width:100%;text-align:left;margin-bottom:5px;background:var(--card);border:1px solid var(--line);font-size:14px;}

  .selrow{margin-bottom:8px;}

  .customrow{display:flex;gap:6px;align-items:stretch;margin-bottom:5px;}
  .customrow > button:first-child{flex:1 1 auto;width:auto!important;margin:0;}
  .customrow > button.delcustom{flex:0 0 44px!important;width:44px!important;display:flex!important;align-items:center;justify-content:center;background:var(--card)!important;border:1px solid var(--line);color:var(--dim)!important;font-size:15px;margin:0;padding:0;}
  .altgroup .free input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px;font-size:14px;}
  .morebtn{background:transparent!important;border:none!important;color:var(--dim)!important;font-size:13px;text-align:center!important;text-decoration:underline;margin-top:6px!important;}
  .morebox{margin-top:6px;}
  .morerow{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .morerow button{flex:1;margin:0;padding:9px 4px;font-size:13px;text-align:center;}
  .pausewrap{display:flex;align-items:center;gap:4px;flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px;}
  .pausewrap input{width:38px;background:transparent;border:none;color:var(--txt);font-size:14px;text-align:center;}
  .pausewrap label{font-size:12px;color:var(--dim);}
  .skipline{margin-top:6px;}
  .skipline button{display:block;width:100%;background:var(--warn);border:1px solid var(--warn);color:#1a1d24;font-size:14px;font-weight:700;text-align:center;padding:13px 4px;margin:0;}
  .resetline{margin-top:6px;}
  .resetline button{display:block;width:100%;background:var(--card);border:1px solid var(--danger);color:var(--danger);font-size:13px;text-align:center;padding:9px 4px;margin:0;}
  .altsheet .free input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px;font-size:14px;}
  .toolbar{display:flex;gap:8px;margin:4px 0 12px;}
  .toolbar button{flex:1;font-size:14px;}
  .hint{color:var(--dim);font-size:13px;margin:2px 2px 12px;line-height:1.4;}
  .backbtn{background:transparent;border:none;color:var(--accent);padding:6px 2px;font-size:16px;margin-bottom:2px;}
  .toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:100;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .toast.show{opacity:1;}
  .setbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
  .setbox .r{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .setbox label{flex:1;font-size:14px;}
  .setbox input{width:70px;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px;font-size:15px;text-align:center;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ===== Übungs-Slots. lo/hi = Wdh-Fenster, startSets, alt = Alternativen ===== */
const SLOTS = {
  // Beine — quad-dominant: Ausfallschritt objektiv top (tiefe Dehnung, einbeinig)
  quadLight:{name:"Ausfallschritt-Kniebeuge (je Bein)", lo:8,hi:12,sets:3,cat:"heavy", alt:["Ausfallschritt-Kniebeuge (je Bein)","Kelchkniebeuge","Aufsteiger"]},
  quadHeavy:{name:"Ausfallschritt-Kniebeuge (je Bein)", lo:8,hi:12,sets:3,cat:"heavy", alt:["Ausfallschritt-Kniebeuge (je Bein)","Kelchkniebeuge","Aufsteiger"]},
  // hüftdominant: RDL objektiv top, bei dir zurückgestuft -> unten mit Warnung
  hinge:{name:"Rumänisches Kreuzheben", lo:8,hi:12,sets:3,cat:"heavy", alt:["Rumänisches Kreuzheben","Hüftstoß","Beckenheben am Boden"], floor:"Beckenheben am Boden"},
  // Druck — Kurzhantel > Boden (tiefe Dehnung)
  chestFlat:{name:"Bankdrücken flach", lo:8,hi:12,sets:3,cat:"heavy", alt:["Schrägbankdrücken 30°","Bankdrücken flach","Bodendrücken"], floor:"Bodendrücken"},
  chestIncline:{name:"Schrägbankdrücken 30°", lo:8,hi:12,sets:3,cat:"heavy", alt:["Schrägbankdrücken 30°","Bankdrücken flach","Bodendrücken"], floor:"Bodendrücken"},
  chestFloor:{name:"Bodendrücken", lo:8,hi:12,sets:3,cat:"heavy", alt:["Schrägbankdrücken 30°","Bankdrücken flach","Bodendrücken"], floor:"Bodendrücken"},
  // optionaler Brust-Ergänzungsslot (nur mit Bank): Pullover > Fly
  chestFly:{name:"Kurzhantel-Überzug", lo:10,hi:15,sets:3,cat:"iso", alt:["Kurzhantel-Überzug","Kurzhantel-Fliegende"]},
  shoulder:{name:"Schulterdrücken", lo:6,hi:12,sets:3,cat:"heavy", alt:["Schulterdrücken","Arnold-Drücken"]},
  // Zug — einarmig abgestützt top (Rücken entlastet), brustgestützt nur mit Bank
  rowOne:{name:"Einarmiges Rudern (je Arm)", lo:8,hi:12,sets:3,cat:"heavy", alt:["Einarmiges Rudern (je Arm)","Brustgestütztes Rudern","Rudern beidarmig","Vorgebeugtes Rudern (frei)"]},
  rowTwo:{name:"Einarmiges Rudern (je Arm)", lo:8,hi:12,sets:3,cat:"heavy", alt:["Einarmiges Rudern (je Arm)","Brustgestütztes Rudern","Rudern beidarmig","Vorgebeugtes Rudern (frei)"], floor:"Vorgebeugtes Rudern (frei)"},
  lat:{name:"Latzug am Band", lo:10,hi:15,sets:3,cat:"heavy", alt:["Latzug am Band","Kurzhantel-Überzug"]},
  // Schulter klein
  lateral:{name:"Seitheben", lo:12,hi:25,sets:3,cat:"iso", alt:["Seitheben","Seitheben am Band"]},
  rearDelt:{name:"Vorgebeugtes Seitheben", lo:12,hi:25,sets:3,cat:"iso", alt:["Vorgebeugtes Seitheben","Umgekehrtes Fliegen"]},
  // Arme — Trizeps über Kopf objektiv top; Bizeps Incline top (nur Bank)
  bicepsSup:{name:"Bizepsbeugen (Untergriff)", lo:10,hi:20,sets:3,cat:"iso", alt:["Schrägbank-Curl","Bizepsbeugen (Untergriff)","Bizepsbeugen (Hammergriff)"]},
  bicepsHam:{name:"Bizepsbeugen (Hammergriff)", lo:10,hi:20,sets:3,cat:"iso", alt:["Schrägbank-Curl","Bizepsbeugen (Untergriff)","Bizepsbeugen (Hammergriff)"]},
  triceps:{name:"Trizepsstrecken über Kopf", lo:10,hi:20,sets:3,cat:"iso", alt:["Trizepsstrecken über Kopf","Enges Bodendrücken"]},
  // Rest
  calf:{name:"Wadenheben (zweibeinig)", lo:12,hi:25,sets:3,cat:"iso", alt:["Wadenheben (zweibeinig)","Einbeiniges Wadenheben","Exzentrisches Wadenabsenken"]},
  plank:{name:"Unterarmstütz", lo:45,hi:45,sets:2,cat:"iso", isTime:true, alt:["Unterarmstütz"]},
};
/* ⚠-Marker + Equipment-Hinweise pro Übungsname (kurz) */
const WARN={
 "Rumänisches Kreuzheben":{t:"⚠ Vorsicht: unterer Rücken", lvl:"warn"},
 "Schulterdrücken":{t:"beobachten", lvl:"note"},
 "Arnold-Drücken":{t:"beobachten", lvl:"note"}
};
/* Nur-mit-Bank-Übungen (ohne Bank ausgeblendet) */
const BANKONLY=["Schrägbankdrücken 30°","Bankdrücken flach","Brustgestütztes Rudern","Kurzhantel-Überzug","Kurzhantel-Fliegende","Schrägbank-Curl"];

/* Tage: Reihenfolge der Slot-Schlüssel. Beinlast tauscht je nach Sonntag (siehe buildDay) */
const DAY_DI_LIGHT=["quadLight","chestFlat","chestFly","rowOne","lateral","bicepsSup","calf","plank"];
const DAY_DI_HEAVY=["quadHeavy","hinge","chestFlat","chestFly","rowOne","lateral","bicepsSup","calf","plank"];
const DAY_DO_HEAVY=["quadHeavy","hinge","lat","chestIncline","chestFly","shoulder","rearDelt","calf"];
const DAY_DO_LIGHT=["quadLight","lat","chestIncline","chestFly","shoulder","rearDelt","calf"];
const DAY_SA=["chestFloor","rowTwo","lat","shoulder","lateral","rearDelt","bicepsHam","triceps","calf"];

/* ===== Storage ===== */
const K={hist:"tl5_hist",last:"tl5_last",struct:"tl5_struct",pref:"tl5_pref",radwk:"tl5_radwk",swap:"tl5_swap",best:"tl5_best",custom:"tl5_custom"};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){toast("Speicher voll?");}};
let last=load(K.last,{}), struct=load(K.struct,{}), swap=load(K.swap,{}), best=load(K.best,{}), custom=load(K.custom,{});
let pref=load(K.pref,{bank:true,stepBank:1,stepNoBank:2.5,confirm:2,keepAwake:true});
let radWeek=load(K.radwk,null);
let working=null, altOpen=-1;

/* ===== Wochenlogik ===== */
function isoWeekKey(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dy=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dy+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));const w=1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7);return `${t.getUTCFullYear()}-W${String(w).padStart(2,"0")}`;}
function radAnswered(){return radWeek&&radWeek.week===isoWeekKey();}
function setRad(v){radWeek={week:isoWeekKey(),rad:v};save(K.radwk,radWeek);renderHome();}

/* Gewichtsschritt nach Ort */
function step(){return pref.bank?pref.stepBank:pref.stepNoBank;}
function restFor(slot,lk){ const st=lk&&struct[lk]; if(st&&st.rest!=null)return st.rest; return slot.cat==="iso"?30:60; }

/* effektiver Slot-Name: Übungswechsel (swap) hat Vorrang, sonst Boden-Ersatz bei !bank */
function slotName(key){
  const s=SLOTS[key];
  if(swap[key]) return swap[key];
  if(!pref.bank && s.floor) return s.floor;
  return s.name;
}
function logKey(key){ return slotName(key); } // Werte pro tatsächlicher Übung

/* ===== Home ===== */
function renderHome(){
  wakeOff();
  working=null;altOpen=-1;
  const ans=radAnswered();
  const heavyDi = ans && radWeek.rad===false; // letzten So NICHT gefahren -> Di schwer

  const radBlock = ans
    ? `<div class="sw"><div class="lab">Letzten Sonntag</div><div class="opts">
         <button class="on" disabled>${radWeek.rad?'Rad':'kein Rad'}</button>
         <button onclick="setRad(${radWeek.rad?false:true})">ändern</button></div></div>`
    : `<div class="sw" style="border-color:var(--accent)"><div class="lab" style="color:var(--accent)">Letzten Sonntag Rad gefahren?</div><div class="opts">
         <button onclick="setRad(true)">Ja</button><button onclick="setRad(false)">Nein</button></div></div>`;

  const days=[
    {k:"di", t:"Dienstag", sub: heavyDi?"Oberkörper + Beine schwer":"Oberkörper + Beine leicht"},
    {k:"do", t:"Donnerstag", sub: heavyDi?"Oberkörper + Beine leicht":"Oberkörper + Beine schwer"},
    {k:"sa", t:"Samstag", sub:"nur Oberkörper"},
  ];
  // "als Nächstes dran" aus letztem Training (Reihenfolge Di->Do->Sa->Di)
  const order=["di","do","sa"];
  const hist=load(K.hist,[]);
  // Leerzustand: heutigen Trainingstag nehmen (heute Di/Do/Sa -> der; sonst nächster kommender)
  const wd=new Date().getDay(); // 0=So..6=Sa
  const nextByWeekday={2:"di",4:"do",6:"sa", 0:"di",1:"di",3:"do",5:"sa"}; // Mo->Di, Mi->Do, Fr->Sa, So->Di
  let nextK=nextByWeekday[wd]||"di", lastInfo="";
  if(hist.length){ const lastEntry=hist[hist.length-1];
    const li=order.indexOf(lastEntry.day); if(li>=0){ nextK=order[(li+1)%order.length]; }
    lastInfo=`zuletzt: ${({di:"Di",do:"Do",sa:"Sa"})[lastEntry.day]||lastEntry.day}, ${fmtDate(lastEntry.date)}`;
  }

  app.innerHTML=`
    <h1>Trainingslog</h1>
    <div class="switches">
      <div class="sw"><div class="lab">Ort</div><div class="opts">
        <button class="${pref.bank?'on':''}" onclick="setBank(true)">mit Bank</button>
        <button class="${!pref.bank?'on':''}" onclick="setBank(false)">ohne</button></div></div>
      ${radBlock}
    </div>
    ${ans?'':'<div class="hint" style="color:var(--accent)">Einmal pro Woche wählen — bestimmt, wann der schwere Beintag liegt.</div>'}
    ${lastInfo?`<div class="stepcount">${lastInfo} · als Nächstes dran: ${({di:"Dienstag",do:"Donnerstag",sa:"Samstag"})[nextK]}</div>`:''}
    <div class="daylist">
      ${days.map(d=>`<div class="daybtn ${d.k===nextK?'heavy':''}" onclick="openDay('${d.k}')">${d.t}<small>${d.sub}</small></div>`).join("")}
    </div>
    <div class="toolbar">
      <button class="btn-ghost" onclick="renderSettings()">Einstellungen</button>
      <button class="btn-ghost" onclick="exportData()">Backup</button>
      <button class="btn-ghost" onclick="exportCSV()">Tabelle (CSV)</button>
      <button class="btn-ghost" onclick="showHistory()">Verlauf</button>
      <button class="btn-ghost" onclick="restoreData()">Wiederherstellen</button>
    </div>
`;
  hideTimer();
}
function setBank(v){pref.bank=v;save(K.pref,pref);renderHome();}

/* ===== Tag aufbauen ===== */
function daySlots(dayKey){
  const ans=radAnswered(); const heavyDi = ans && radWeek.rad===false;
  let list = dayKey==="di" ? (heavyDi?DAY_DI_HEAVY:DAY_DI_LIGHT)
           : dayKey==="do" ? (heavyDi?DAY_DO_LIGHT:DAY_DO_HEAVY)
           : DAY_SA;
  // Slots ohne Bank herausnehmen, deren Optionen komplett bank-abhängig sind (z.B. chestFly)
  if(!pref.bank){ list = list.filter(k=>{ const s=SLOTS[k]; if(!s||!s.alt) return true;
    const anyUsable = s.alt.some(a=>!BANKONLY.includes(a)); return anyUsable; }); }
  return list;
}

/* ===== Bestwerte: best[übung][satzIndex][gewicht] = maxWdh; +lastDate ===== */
function bestGet(lk,si,w){ try{ return best[lk] && best[lk].sets && best[lk].sets[si] && best[lk].sets[si][String(w)]; }catch(e){ return null; } }
function bestUpdate(lk,si,w,r){
  if(w===""||w==null||r===""||r==null) return;
  best[lk]=best[lk]||{sets:[],lastDate:null};
  best[lk].sets[si]=best[lk].sets[si]||{};
  const key=String(w); const cur=best[lk].sets[si][key];
  if(cur==null || Number(r)>Number(cur)) best[lk].sets[si][key]=Number(r);
}
function bestTouch(lk){ best[lk]=best[lk]||{sets:[],lastDate:null}; best[lk].lastDate=new Date().toISOString(); }
function weeksSince(iso){ if(!iso) return 0; return (Date.now()-new Date(iso))/ (7*864e5); }
function bestReset(lk){ if(best[lk]){ best[lk]={sets:[],lastDate:null}; save(K.best,best); } }

/* ===== Wake Lock: Bildschirm beim Training anlassen (Standard-API, browserunabhängig) ===== */
let _wakeLock=null;
async function wakeOn(){
  try{
    if(!pref.keepAwake) return;
    if(!("wakeLock" in navigator)) return;   // Browser kann es nicht -> still überspringen
    _wakeLock = await navigator.wakeLock.request("screen");
    _wakeLock.addEventListener && _wakeLock.addEventListener("release",()=>{ _wakeLock=null; });
  }catch(e){ _wakeLock=null; }   // z.B. iOS verweigert -> kein Fehler nach außen
}
async function wakeOff(){
  try{ if(_wakeLock){ await _wakeLock.release(); _wakeLock=null; } }catch(e){ _wakeLock=null; }
}
// Reaktivieren, wenn App wieder in den Vordergrund kommt (iOS verliert den Lock sonst)
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && working && pref.keepAwake) wakeOn(); });

function openDay(dayKey){
  const keys=daySlots(dayKey);
  // 4-Wochen-Nachfrage je Übung (einmal pro Öffnen)
  keys.forEach(key=>{ const lk=logKey(key); const b=best[lk];
    if(b && b.lastDate && weeksSince(b.lastDate)>=4){
      if(confirm(`„${slotName(key)}" seit über 4 Wochen nicht trainiert. Bestwerte zurücksetzen (neu anfangen)? Historie bleibt erhalten.`)){ bestReset(lk); }
      else { bestTouch(lk); save(K.best,best); } // behalten, Uhr neu stellen
    }
  });
  working={day:dayKey,date:new Date().toISOString(),ex:keys.map(key=>{
    const s=SLOTS[key]; const nm=slotName(key); const lk=logKey(key);
    const st=struct[lk]||{}; const nSets=st.sets!=null?st.sets:s.sets;
    const prev=last[lk];
    const sets=[];
    for(let i=0;i<nSets;i++){
      const p=prev&&prev.sets&&prev.sets[i]?prev.sets[i]:null;
      // Gewicht: letztes Gewicht dieses Satzes, sonst Satz1-Gewicht, sonst Platzhalter 3
      let w = (p&&p.w!=null&&p.w!=="")?p.w : (prev&&prev.sets&&prev.sets[0]?prev.sets[0].w:"3");
      if(w===""||w==null) w="3";
      // Wdh: Bestwert bei DIESEM Gewicht in DIESEM Satz; sonst unteres Fensterende
      const bw = bestGet(lk,i,w);
      const r = (bw!=null)?Number(bw) : (s.lo);
      sets.push({w:w, r:r, isNew:(bw==null)});
    }
    return {key,name:nm,lo:s.lo,hi:s.hi,rest:restFor(s,lk),isTime:!!s.isTime,alt:s.alt,sets,curSet:0,
            note:(prev&&prev.note)||"", skipped:!!st.skipped, suggest:suggestFor(lk,s,nSets,prev)};
  })};
  working.cur=null; altOpen=-1; renderDay(); wakeOn();
}

/* Automatik: Vorschlag auf Basis der letzten Trainings */
function suggestFor(lk,slot,nSets,prev){
  if(slot.isTime) return null;
  if(!prev||!prev.sets||!prev.sets.length) return null;
  // Alle Sätze beim jeweils zuletzt gefahrenen Gewicht auf der Obergrenze? (2x über Historie bestätigt)
  const hist=load(K.hist,[]).filter(h=>h.ex.some(e=>e.n===lk)).slice(-pref.confirm);
  if(hist.length<pref.confirm) return null;
  const allTop = hist.every(h=>{const e=h.ex.find(x=>x.n===lk); if(!e||!e.sets.length) return false;
    return e.sets.every(s=>Number(s.r)>=slot.hi);});
  if(!allTop) return null;
  const lastN = prev.sets.length;
  // Erst Satz dazu (bis Ziel-Satzzahl+? – wir erlauben genau einen Extrasatz über slot.sets)
  if(lastN < slot.sets+1 && lastN <= slot.sets){
    return {type:"addset", txt:`Alle ${lastN} Sätze auf ${slot.hi} (${pref.confirm}× bestätigt). Signal: ${slot.sets+1}. Satz dazu.`};
  }
  // Sonst: Gewicht erhöhen – Signal + zwei Optionen (Satz 1 / alle Sätze)
  const inc=step();
  return {type:"weight", inc, txt:`Alle Sätze auf ${slot.hi} (${pref.confirm}× bestätigt). Signal: +${fmtKg(inc)} kg. Nur Satz 1 oder alle Sätze?`};
}

function renderDay(){
  const titles={di:"Dienstag",do:"Donnerstag",sa:"Samstag"};
  if(working.cur==null) working.cur=firstActive(0);
  const cur=working.cur;
  const active=working.ex.map((e,i)=>i).filter(i=>!working.ex[i].skipped);
  const posInActive=active.indexOf(cur)+1;
  const before=[]; for(let i=0;i<cur;i++) before.push(i);
  const rest=[];   for(let i=cur+1;i<working.ex.length;i++) rest.push(i);
  const isLast = firstActive(cur+1)===-1;
  const refKg=(e)=> (!e.isTime&&e.sets&&e.sets[0]&&e.sets[0].w&&e.sets[0].w!=="3")?` <span class="unref">${fmtKg(Number(e.sets[0].w))} kg</span>`:'';
  const rowDone=(i)=>{const e=working.ex[i];const nr=activeNum(i);return `<div class="un done ${e.skipped?'skip':''}"><div class="nm" onclick="jumpTo(${i})">${nr?`${nr}. `:''}${e.name}${refKg(e)}</div><button onclick="listSkip(${i})">${e.skipped?'zurück':'auslassen'}</button></div>`;};
  const rowNext=(i)=>{const e=working.ex[i];const nr=activeNum(i);return `<div class="un ${e.skipped?'skip':''}"><div class="nm" onclick="jumpTo(${i})">${nr?`${nr}. `:''}${e.name}${e.skipped?'':refKg(e)}</div><button onclick="listSkip(${i})">${e.skipped?'zurück':'auslassen'}</button></div>`;};
  app.innerHTML=`
    <button class="backbtn" onclick="confirmBack()">‹ Verlassen</button>
    <h1>${titles[working.day]} <span>${fmtDateShort(working.date)} · Schritt ${fmtKg(step())} kg</span></h1>
    ${before.length?`<div class="upnext donelist">${before.map(rowDone).join("")}</div>`:''}
    ${cur>=0?exCard(working.ex[cur],cur):'<div class="hint">Alle Übungen ausgelassen.</div>'}
    <div class="navrow">
      ${prevActive(cur)>=0?`<button class="btn-ghost" onclick="goPrev()">‹ zurück</button>`:''}
      ${isLast?`<button class="btn-accent" onclick="finishDay()">Einheit speichern</button>`:`<button class="btn-accent" onclick="goNext()">weiter ›</button>`}
    </div>
    ${rest.length?`<div class="upnext">${rest.map(rowNext).join("")}</div>`:''}
    `;
  showTimer();markFilled();
}
function activeNum(idx){ return idx+1; }   // feste Nummer = Position im Plan, ändert sich nicht beim Auslassen
function firstActive(from){ for(let i=Math.max(0,from);i<working.ex.length;i++) if(!working.ex[i].skipped) return i; return -1; }
function prevActive(from){ for(let i=from-1;i>=0;i--) if(!working.ex[i].skipped) return i; return -1; }
function focusCur(){ requestAnimationFrame(()=>{ const el=document.getElementById("curEx"); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); else window.scrollTo(0,0); }); }
function goNext(){ const n=firstActive(working.cur+1); if(n>=0){working.cur=n; renderDay(); focusCur();
  startExPause(60);   // Übungspause: 60s, nur Ton am Ende (kein sichtbarer Countdown)
} }
let exH=null;
function startExPause(sec){ prime(); if(exH)clearInterval(exH); let r=sec;
  exH=setInterval(()=>{ r--;
    if(r<=0){ clearInterval(exH); exH=null; beep(); }   // genau ein Ton nach Ablauf
  },1000);
}
function jumpTo(i){ if(i==null||i<0||i>=working.ex.length)return; working.cur=i; altOpen=-1; renderDay(); focusCur(); }
function goPrev(){ const p=prevActive(working.cur); if(p>=0){working.cur=p; renderDay(); focusCur();} }
function listSkip(i){ working.ex[i].skipped=!working.ex[i].skipped;
  struct[working.ex[i].key]=struct[working.ex[i].key]||{}; struct[working.ex[i].key].skipped=working.ex[i].skipped; save(K.struct,struct);
  renderDay(); }

let moreOpen=-1;
function toggleMore(ei){ moreOpen=moreOpen===ei?-1:ei; renderDay(); }
function bestSummary(lk){
  const b=best[lk];
  if(!b||!b.sets||!b.sets.length) return "";
  const parts=b.sets.map((satz,i)=>{ if(!satz) return null;
    let bw=0,bg=null; Object.keys(satz).forEach(g=>{ if(Number(satz[g])>=bw){bw=Number(satz[g]);bg=g;} });
    return bg!=null?`S${i+1}: ${fmtKg(Number(bg))}kg×${bw}`:null;
  }).filter(Boolean);
  return parts.length?("Bestwerte — "+parts.join("  ·  ")):"";
}
function resetOneBest(ei){ const lk=logKey(working.ex[ei].key);

function upd(ei,si,k,v){ if(working)working.dirty=true;
  const e=working.ex[ei]; e.sets[si][k]=v;
  if(k==='w' && si===0){ for(let j=1;j<e.sets.length;j++){ if(!e.sets[j].w || e.sets[j]._autow){ e.sets[j].w=v; e.sets[j]._autow=true; renderSetWeight(ei,j,v); } } }
}
function repStep(ei,si,d){ if(working)working.dirty=true;
  const e=working.ex[ei]; let n=Number(e.sets[si].r)||0; n=Math.max(0,n+d); e.sets[si].r=n; e.sets[si].isNew=false;
  const el=document.getElementById(`rep${ei}_${si}`); if(el){ el.textContent=n; const inRange=!e.isTime && n>=e.lo && n<=e.hi; el.classList.toggle('ok', inRange); el.classList.toggle('bad', !e.isTime && !inRange); }
  advanceMarker(ei, si);
}
/* Marker rückt genau EINMAL pro Satz weiter – egal ob durch Wdh-Änderung oder Pause */
function advanceMarker(ei, si){
  const e=working.ex[ei];
  if(e.curSet==null) e.curSet=0;
  e._done=e._done||{};
  if(e._done[si]) return;              // dieser Satz hat schon einmal gerückt (kein Doppelsprung)
  e._done[si]=true;
  // Der angefasste Satz gilt als erledigt -> Marker auf den nächsten, aber nur vorwärts
  const target=Math.min(si+1, e.sets.length-1);
  if(target>e.curSet) e.curSet=target;
  highlightCurrent(ei);
}

function applyAddSet(ei){
  const e=working.ex[ei]; const s=SLOTS[e.key];
  const w0=e.sets.length?e.sets[e.sets.length-1].w:"";
  e.sets.push({w:w0, r:s.lo, isNew:true});
  struct[logKey(e.key)]=struct[logKey(e.key)]||{}; struct[logKey(e.key)].sets=e.sets.length; save(K.struct,struct);
  e.suggest=null; toast("Satz dazu"); renderDay();
}
function applyWeight(ei,allSets){
  const e=working.ex[ei]; const s=SLOTS[e.key]; const inc=e.suggest?e.suggest.inc:step();
  if(allSets){
    e.sets.forEach(x=>{ const base=Number(x.w)||0; x.w=fmtKg(base+inc); x.r=s.lo; x.isNew=true; });
    toast(`Alle Sätze +${fmtKg(inc)} kg`);
  } else {
    const x=e.sets[0]; const base=Number(x.w)||0; x.w=fmtKg(base+inc); x.r=s.lo; x.isNew=true;
    toast(`Satz 1 +${fmtKg(inc)} kg`);
  }
  e.suggest=null; renderDay();
}

function finishDay(){
  working.ex.forEach(e=>{if(e.skipped)return;
    const lk=logKey(e.key);
    last[lk]={sets:e.sets.map(s=>({w:s.w,r:s.r})),note:e.note};
    if(!e.isTime){ e.sets.forEach((s,si)=>bestUpdate(lk,si,s.w,s.r)); }
    bestTouch(lk);
  });
  save(K.last,last); save(K.best,best);
  const hist=load(K.hist,[]);
  hist.push({day:working.day,date:working.date,bank:pref.bank,rad:(radWeek&&typeof radWeek.rad==="boolean")?radWeek.rad:null,ex:working.ex.map(e=>e.skipped?({n:logKey(e.key),name:e.name,skipped:true}):({n:logKey(e.key),name:e.name,sets:e.sets.map(s=>({w:s.w,r:s.r,rir:s.rir})),note:e.note}))});
  save(K.hist,hist);
  if(confirm("Einheit gespeichert.\n\nOK = Tabelle (CSV) teilen/ablegen\nAbbrechen = überspringen")){ exportCSV(); }
  toast("Gespeichert ✓"); setTimeout(renderHome,650);
}
function confirmBack(){
  if(!working || !working.dirty){ renderHome(); return; }  // nichts geändert -> direkt raus
  // 1. Dialog: speichern?  OK = speichern & verlassen / Abbrechen = weiter entscheiden
  if(confirm("Einheit speichern und verlassen?\n\nOK = speichern & verlassen\nAbbrechen = nicht speichern")){ finishDay(); return; }
  // 2. Dialog: wirklich verwerfen?  OK = verwerfen & raus / Abbrechen = zurück ins Training
  if(confirm("Ohne Speichern verlassen? Eingaben gehen verloren.\n\nOK = verwerfen & verlassen\nAbbrechen = zurück zum Training")){ renderHome(); }
}

function buildBackupBlob(){
  const data={hist:load(K.hist,[]),last:load(K.last,{}),struct:load(K.struct,{}),swap:load(K.swap,{}),custom:load(K.custom,{}),pref,radWeek,exported:new Date().toISOString()};
  return new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
}
function buildCSV(){
  const hist=load(K.hist,[]);
  const esc=(v)=>{ const t=(v==null?"":String(v)); return /[",;\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
  const rows=[["Datum","Wochentag","Ort","Rad_Sonntag","Uebung","Satz","Gewicht_kg","Wiederholungen","Status"]];
  const tt={di:"Dienstag",do:"Donnerstag",sa:"Samstag"};
  hist.forEach(h=>{
    const datum=(h.date||"").slice(0,10);
    const tag=tt[h.day]||h.day||"";
    const ort=h.bank?"mit Bank":"ohne Bank";
    const rad=(h.rad===true)?"ja":(h.rad===false)?"nein":"";
    (h.ex||[]).forEach(e=>{
      const ueb=e.name||e.n||"";
      if(e.skipped){ rows.push([datum,tag,ort,rad,ueb,"","","","ausgelassen"]); return; }
      (e.sets||[]).forEach((st,i)=>{ rows.push([datum,tag,ort,rad,ueb,i+1,st.w||"",st.r||"","gemacht"]); });
    });
  });
  const csv=rows.map(r=>r.map(esc).join(";")).join("\r\n");
  return new Blob(["\ufeff"+csv],{type:"text/csv"});  // BOM für Excel-Umlaute
}
// Teilen (iOS Web Share mit Datei) mit Fallback auf Download
async function shareOrDownload(blob, filename){
  const file=new File([blob], filename, {type:blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:filename}); toast("Geteilt"); return; }catch(e){ if(e && e.name==="AbortError") return; }
  }
  const u=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=u;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast("Als Datei gesichert");
}
function exportData(){ const d=new Date().toISOString().slice(0,10);
  shareOrDownload(buildBackupBlob(), `trainingslog_backup_${d}.json`);
}
function exportCSV(){ const d=new Date().toISOString().slice(0,10);
  shareOrDownload(buildCSV(), `trainingslog_${d}.csv`);
}
function restoreData(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d.hist&&!d.last){ toast("Keine gültige Sicherung"); return; }
      if(!confirm("Diese Sicherung laden? Der aktuelle Stand wird ersetzt.")) return;
      if(d.hist)save(K.hist,d.hist); if(d.last)save(K.last,d.last); if(d.struct)save(K.struct,d.struct);
      if(d.swap)save(K.swap,d.swap); if(d.custom)save(K.custom,d.custom); if(d.pref)save(K.pref,d.pref); if(d.radWeek)save(K.radwk,d.radWeek);
      last=load(K.last,{});struct=load(K.struct,{});swap=load(K.swap,{});pref=load(K.pref,pref);radWeek=load(K.radwk,radWeek);
      toast("Wiederhergestellt ✓"); renderHome();
    }catch(e){ toast("Datei nicht lesbar"); } };
    r.readAsText(f); };
  inp.click();
}

let tH=null,tRem=0,ac=null,aReady=false,tBtnEi=null;
function showTimer(){}function hideTimer(){ if(tH){clearInterval(tH);tH=null;} tBtnEi=null; }
function prime(){if(aReady)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);aReady=true;}catch(e){}}
function tone(freq,dur,vol){ if(!ac)return; try{const n=ac.currentTime;const os=ac.createOscillator(),g=ac.createGain();os.type="sine";os.frequency.value=freq;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+dur);os.connect(g);g.connect(ac.destination);os.start(n);os.stop(n+dur+.02);}catch(e){} }
function tickSoft(){ tone(660,.06,.08); }                        // leiser Tick (10..4 s)
function tickLoud(){ tone(880,.12,.3); if(navigator.vibrate)navigator.vibrate(40); } // deutlich (3,2,1)
function beep(){ // Schlusston: länger + Vibration
  if(navigator.vibrate)navigator.vibrate([300,120,300]);
  if(!ac)return; try{const n=ac.currentTime;const os=ac.createOscillator(),g=ac.createGain();os.type="sine";os.frequency.value=880;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.45,n+.03);g.gain.setValueAtTime(.45,n+.5);g.gain.exponentialRampToValueAtTime(.0001,n+.9);os.connect(g);g.connect(ac.destination);os.start(n);os.stop(n+.95);}catch(e){}
}
function startRest(s,ei){prime();tBtnEi=ei;startTimer(s);
  if(ei!=null && working&&working.ex[ei]){ const e=working.ex[ei];
    if(e.curSet==null) e.curSet=0;
    advanceMarker(ei, e.curSet);   // rückt einmal pro Satz, teilt Sperre mit Wdh-Änderung
  }
}
function highlightCurrent(ei){
  const e=working.ex[ei];
  e.sets.forEach((_,si)=>{ const row=document.getElementById(`row${ei}_${si}`); if(row) row.classList.toggle('current', e.curSet===si); });
}
function timerBtn(){ return tBtnEi!=null?document.getElementById("restBtn"+tBtnEi):null; }
function startTimer(s){clearInterval(tH);tRem=s;const b=timerBtn();if(b){b.classList.add("running");b.classList.remove("done");}updDisp();
  tH=setInterval(()=>{tRem--;updDisp();
    if(tRem>=1 && tRem<=3) tickLoud();
    if(tRem<=0){clearInterval(tH);tH=null;const bb=timerBtn();if(bb){bb.classList.remove("running");bb.classList.add("done");bb.textContent="fertig ✓";}beep();
      setTimeout(()=>{const b2=timerBtn();if(b2){b2.classList.remove("done");const r=b2.dataset.rest;b2.textContent=r+"s ▶";}},2500);
    }
  },1000);}
function updDisp(){const b=timerBtn();if(!b)return; b.textContent=String(Math.max(0,tRem));}

/* ===== Helpers ===== */
function fmtKg(n){return (Math.round(n*10)/10).toString().replace(".",",");}
function fmtDate(iso){return new Date(iso).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});}
function fmtDateShort(iso){return new Date(iso).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);}
